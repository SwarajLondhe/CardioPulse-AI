<svg width="560" height="120" viewBox="0 0 560 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoBlueGrad" x1="15" y1="15" x2="95" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="logoRedGrad" x1="60" y1="10" x2="85" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="logoGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Brand Mark Icon (Left, 100x100) -->
  <g transform="translate(10, 10) scale(0.5)" filter="url(#logoGlow)">
    <!-- Aortic Vascular Arch -->
    <path d="M96 46 C96 26 122 18 134 32 C142 41 138 52 130 62" fill="none" stroke="url(#logoRedGrad)" stroke-width="7" stroke-linecap="round"/>
    <!-- Pulmonary Trunk -->
    <path d="M78 52 C70 38 85 24 95 32" fill="none" stroke="#06B6D4" stroke-width="5" stroke-linecap="round"/>
    <!-- Heart Body -->
    <path d="M100 176 C72 152 36 126 36 84 C36 54 58 38 82 46 C92 49 97 56 100 64 C103 56 108 49 118 46 C142 38 164 54 164 84 C164 126 128 152 100 176 Z" 
          fill="url(#logoBlueGrad)" fill-opacity="0.95"/>
    <!-- Circuit lines -->
    <path d="M130 65 L148 55 L160 55" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="160" cy="55" r="3.5" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.8"/>
    <path d="M55 110 L44 122 L32 122" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" cy="122" r="3.5" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.8"/>
    <!-- ECG Line -->
    <path d="M22 105 L58 105 L68 92 L76 118 L88 48 L100 156 L110 96 L120 112 L130 105 L178 105" 
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Synapse Nodes -->
    <circle cx="88" cy="48" r="4.5" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="100" cy="156" r="4.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Typography: CardioPulse AI -->
  <g transform="translate(125, 20)">
    <!-- Primary Title -->
    <text x="0" y="42" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="38" font-weight="800" fill="#0F172A" letter-spacing="-0.03em">
      Cardio<tspan fill="#0284C7">Pulse</tspan>
    </text>

    <!-- AI Badge -->
    <rect x="220" y="12" width="56" height="34" rx="8" fill="#0284C7"/>
    <text x="248" y="36" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">
      AI
    </text>

    <!-- Tagline -->
    <text x="2" y="66" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#0369A1" letter-spacing="0.04em">
      SMART HEART HEALTH PREDICTION SYSTEM
    </text>

    <!-- Slogan -->
    <text x="2" y="86" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B" letter-spacing="0.02em">
      Predict. Understand. Stay Aware.
    </text>
  </g>
</svg>
