<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Medical Blue to Cyan Gradient -->
    <linearGradient id="cpBlueGradient" x1="30" y1="30" x2="170" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="45%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Red Cardiac Accent Gradient -->
    <linearGradient id="cpRedGradient" x1="120" y1="20" x2="160" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>

    <!-- Cyan Neon Glow Gradient -->
    <linearGradient id="cpCyanGradient" x1="30" y1="105" x2="170" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <!-- Soft Cardiac Glow Shadow -->
    <filter id="cpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#cpGlow)">
    <!-- Aortic Vascular Arch (Top Center-Right Red Accent) -->
    <path d="M96 46 C96 26 122 18 134 32 C142 41 138 52 130 62" fill="none" stroke="url(#cpRedGradient)" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Pulmonary Trunk (Top Left Blue/Cyan) -->
    <path d="M78 52 C70 38 85 24 95 32" fill="none" stroke="url(#cpCyanGradient)" stroke-width="5" stroke-linecap="round"/>

    <!-- Main Anatomical-Tech Heart Body -->
    <path d="M100 176 C72 152 36 126 36 84 C36 54 58 38 82 46 C92 49 97 56 100 64 C103 56 108 49 118 46 C142 38 164 54 164 84 C164 126 128 152 100 176 Z" 
          fill="url(#cpBlueGradient)" fill-opacity="0.94"/>

    <!-- Highlight Reflection on Upper Left Ventricular Wall -->
    <path d="M46 80 C46 60 62 48 80 52 C84 53 88 56 90 60 C80 62 70 70 64 82 C60 90 58 102 58 114 C50 102 46 90 46 80 Z" 
          fill="#FFFFFF" fill-opacity="0.25"/>

    <!-- AI Circuit Traces (Machine Learning Infrastructure) -->
    <!-- Circuit 1: Upper Right -->
    <path d="M130 65 L148 55 L160 55" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 1"/>
    <circle cx="160" cy="55" r="3" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5"/>

    <!-- Circuit 2: Left Flank -->
    <path d="M55 110 L44 122 L32 122" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="32" cy="122" r="2.8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>

    <!-- Circuit 3: Lower Apex Branch -->
    <path d="M104 160 L118 170 L132 170" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="132" cy="170" r="3" fill="#FFFFFF" stroke="#06B6D4" stroke-width="1.5"/>

    <!-- Integrated ECG Heartbeat Rhythm Line (Crossing Core) -->
    <path d="M22 105 L58 105 L68 92 L76 118 L88 48 L100 156 L110 96 L120 112 L130 105 L178 105" 
          fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Core ECG Pulse Nodes (AI Neural Synapses) -->
    <circle cx="88" cy="48" r="4.5" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.8"/>
    <circle cx="100" cy="156" r="4" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.8"/>
    <circle cx="110" cy="96" r="3.5" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
  </g>
</svg>
